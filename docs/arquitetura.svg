<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="620" viewBox="0 0 1100 620"
     role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Arquitetura do sistema Suporte TI</title>
  <desc id="descricao">
    Cenário 1.1: interface HTML, CSS e JavaScript servida pelo Nginx
    em container Docker. A interface se comunica por REST com a API
    Flask, em outro container. A API consulta o ViaCEP por HTTPS
    e persiste os chamados no SQLite, armazenado em volume.
  </desc>

  <defs>
    <marker id="seta"
            viewBox="0 0 10 10"
            refX="5" refY="5"
            markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#526581"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#f3f5f9"/>

  <g font-family="Arial, sans-serif" fill="#17243b">
    <text x="50" y="55" font-size="28" font-weight="700">
      Suporte TI — Arquitetura
    </text>
    <text x="50" y="87" font-size="17" fill="#58677d">
      Cenário 1.1 · Interface + API própria + serviço externo
    </text>

    <!-- Componentes desenvolvidos -->
    <rect x="50" y="165" width="280" height="165"
          rx="16" fill="#ffffff" stroke="#2456d6" stroke-width="2"/>
    <text x="190" y="198" text-anchor="middle"
          font-size="13" fill="#2456d6">CONTAINER DOCKER</text>
    <text x="190" y="234" text-anchor="middle"
          font-size="22" font-weight="700">Interface</text>
    <text x="190" y="265" text-anchor="middle" font-size="16">
      HTML · CSS · JavaScript
    </text>
    <text x="190" y="294" text-anchor="middle"
          font-size="15" fill="#58677d">Nginx · porta local 8080</text>

    <rect x="470" y="165" width="280" height="165"
          rx="16" fill="#ffffff" stroke="#2456d6" stroke-width="2"/>
    <text x="610" y="198" text-anchor="middle"
          font-size="13" fill="#2456d6">CONTAINER DOCKER</text>
    <text x="610" y="234" text-anchor="middle"
          font-size="22" font-weight="700">API própria</text>
    <text x="610" y="265" text-anchor="middle" font-size="16">
      Python · Flask · REST
    </text>
    <text x="610" y="294" text-anchor="middle"
          font-size="15" fill="#58677d">Regras e validações dos chamados</text>

    <!-- Persistência -->
    <rect x="870" y="180" width="180" height="135"
          rx="16" fill="#eaf7ef" stroke="#22946b" stroke-width="2"/>
    <text x="960" y="224" text-anchor="middle"
          font-size="22" font-weight="700">SQLite</text>
    <text x="960" y="256" text-anchor="middle" font-size="15">
      Dados dos chamados
    </text>
    <text x="960" y="283" text-anchor="middle"
          font-size="14" fill="#58677d">Arquivo em volume</text>

    <!-- Serviço externo -->
    <rect x="470" y="435" width="280" height="125"
          rx="16" fill="#eaf1ff" stroke="#7095d8" stroke-width="2"/>
    <text x="610" y="470" text-anchor="middle"
          font-size="13" fill="#2456d6">SERVIÇO EXTERNO</text>
    <text x="610" y="504" text-anchor="middle"
          font-size="22" font-weight="700">ViaCEP</text>
    <text x="610" y="536" text-anchor="middle" font-size="16">
      Consulta de endereço por CEP
    </text>

    <!-- Comunicação -->
    <g stroke="#526581" stroke-width="2"
       marker-start="url(#seta)" marker-end="url(#seta)">
      <line x1="342" y1="247" x2="458" y2="247"/>
      <line x1="762" y1="247" x2="858" y2="247"/>
      <line x1="610" y1="342" x2="610" y2="423"/>
    </g>

    <text x="400" y="207" text-anchor="middle"
          font-size="14" fill="#58677d">REST / JSON</text>
    <text x="400" y="228" text-anchor="middle"
          font-size="13" fill="#58677d">via /api/ no Nginx</text>

    <text x="810" y="226" text-anchor="middle"
          font-size="14" fill="#58677d">Leitura/escrita</text>

    <text x="630" y="385" font-size="14" fill="#58677d">
      HTTPS / JSON
    </text>

    <text x="50" y="590" font-size="14" fill="#58677d">
      Repositórios separados para interface e API. O SQLite não é um módulo externo.
    </text>
  </g>
</svg>
